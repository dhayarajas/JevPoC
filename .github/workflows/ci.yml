name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python -m jevpoc.run all
      - run: python -m jevpoc.eval.gate   # slide 46: block any Arm C metric worse by > 1 pt
