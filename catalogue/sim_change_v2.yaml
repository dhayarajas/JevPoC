use_case: fraud.sim_change
version: 2
owner: fraud-identity
status: published
model: jev-1.14.0
timeout_ms: 500
state_budget_tokens: 600
fallback: existing_rules_and_analyst
state_spec: event_type, channel, auth_method, new_device, tenure_band, changes_72h_band, geo_match, contact_velocity_7d_band, interaction_notes (masked)
approvals:              # POC placeholders; real sign-off happens in the PR (CODEOWNERS)
  - {role: owner, by: fraud-identity, on: 2026-10-31}
  - {role: privacy, by: privacy-review, on: 2026-10-31}
eval:
  dataset: data/eval (synthetic, frozen)
  status: mock_only     # re-run make l8 with a TypeSafe key before any pilot
questions:
  suspicious:
    type: noul
    instructions: This SIM change looks like an account takeover attempt rather than the account holder.
    criteria:
      "true": The pattern fits a takeover, for example SMS OTP on a new device after recent changes, a location mismatch, or pressure in `interaction_notes`
      "false": The pattern fits the account holder, for example a store visit with ID, a long-tenured account and no recent changes
  pressure_tactics:
    type: noul
    instructions: "`interaction_notes` show the requester pushing for speed or avoiding verification."
  ato_risk:
    type: score
    instructions: How likely is this request to be an account takeover?
    criteria:
      - No takeover signals
      - One weak signal
      - Several signals that a fraud analyst would review
      - Strong signals of a takeover in progress
      - Clear takeover pattern
  recommended_action:
    type: choice
    instructions: Which handling fits this change request?
    criteria:
      allow: Normal customer behaviour, let the change go through
      step_up: Some risk, confirm with a stronger check such as an app push
      hold: Strong signs of takeover, stop the change
      analyst: Unusual pattern that a fraud analyst should look at
thresholds:
  hold: 0.8
  step_up: 0.5
  ato_hold: 3.0
  action_confidence: 0.6   # Jev's recommended action may only raise the handling
